      <rect x="310" y="480" width="8" height="6" />
      <rect x="350" y="520" width="8" height="6" />
      <rect x="1260" y="420" width="8" height="6" />
      <rect x="1330" y="450" width="8" height="6" />
      <rect x="1360" y="510" width="8" height="6" />
    </g>
  </g>

