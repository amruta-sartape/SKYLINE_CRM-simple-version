      <rect x="340" y="290" width="35" height="18" rx="1" />
      <rect x="290" y="370" width="30" height="18" rx="1" />
      <rect x="395" y="450" width="30" height="18" rx="1" />
      <rect x="240" y="530" width="25" height="18" rx="1" />
      <rect x="340" y="610" width="32" height="18" rx="1" />
