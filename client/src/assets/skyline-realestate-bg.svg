    <line x1="1315" y1="290" x2="1315" y2="200" stroke="#60A5FA" stroke-width="2" opacity="0.8" />
    <circle cx="1315" cy="200" r="3" fill="#EF4444" />

    <!-- Distant Tower 5 (Far Right) -->
    <rect x="1620" y="440" width="220" height="640" fill="#0E1A2F" />

    <!-- Subtle Distant Window Glimmers -->
    <g fill="#FDE68A" opacity="0.5">
