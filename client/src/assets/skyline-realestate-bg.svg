<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Night Atmosphere Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060A12" />
      <stop offset="40%" stop-color="#0B1322" />
      <stop offset="75%" stop-color="#111D33" />
      <stop offset="100%" stop-color="#0D1626" />
    </linearGradient>

    <!-- Warm Golden Penthouse Light Gradient -->
    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.4" />
    </linearGradient>

    <!-- Cool High-Rise Glass Glaze Gradient -->
    <linearGradient id="glassFacadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2E4A" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#2D436B" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#1A2840" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111B2C" stop-opacity="0.98" />
    </linearGradient>

    <!-- Tower 2 Facade Gradient -->
    <linearGradient id="glassTower2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#152238" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#223656" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0E1726" stop-opacity="0.98" />
    </linearGradient>

    <!-- Tower 3 Facade Gradient -->
    <linearGradient id="glassTower3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2840" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#2A3F61" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#101A2B" stop-opacity="0.95" />
    </linearGradient>

    <!-- Ambient Skyline Glow -->
    <radialGradient id="cityGlow" cx="65%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#060A12" stop-opacity="0" />
    </radialGradient>

    <!-- Horizon Warm Accent Glow -->
    <radialGradient id="horizonGlow" cx="35%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060A12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  
  <!-- Subtle Atmospheric Lighting Spheres -->
  <rect width="1920" height="1080" fill="url(#cityGlow)" />
  <rect width="1920" height="1080" fill="url(#horizonGlow)" />

  <!-- ================= BACKGROUND SILHOUETTE TOWERS (DEPTH LAYER) ================= -->
  <g opacity="0.4" fill="#0B1322">
    <!-- Distant Spire 1 -->
    <rect x="120" y="450" width="140" height="630" />
    <polygon points="120,450 190,340 260,450" />
    <!-- Distant Tower 2 -->
    <rect x="320" y="380" width="180" height="700" />
    <!-- Distant Tower 3 -->
    <rect x="580" y="420" width="150" height="660" />
    <!-- Distant Spire 4 -->
    <rect x="1380" y="360" width="160" height="720" />
    <polygon points="1380,360 1460,260 1540,360" />
    <!-- Distant High-Rise 5 -->
    <rect x="1600" y="410" width="220" height="670" />
  </g>

