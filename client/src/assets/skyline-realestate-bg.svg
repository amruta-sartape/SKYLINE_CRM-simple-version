    <circle cx="160" cy="220" r="3" fill="#EF4444" />

    <!-- Distant Tower 2 -->
    <rect x="260" y="420" width="160" height="660" fill="#101D33" />
    <polygon points="260,420 340,360 420,420" fill="#142440" />

    <!-- Distant Tower 3 -->
    <rect x="780" y="460" width="190" height="620" fill="#0E1A2E" />

    <!-- Distant Tower 4 (Center Right) -->
