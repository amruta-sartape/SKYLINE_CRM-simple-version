    <!-- Horizontal Floor Slabs -->
    <g stroke="#3B5982" stroke-width="2" opacity="0.7">
      <line x1="180" y1="280" x2="420" y2="280" />
      <line x1="180" y1="330" x2="420" y2="330" />
      <line x1="180" y1="380" x2="420" y2="380" />
      <line x1="180" y1="430" x2="420" y2="430" />
      <line x1="180" y1="480" x2="420" y2="480" />
      <line x1="180" y1="530" x2="420" y2="530" />
      <line x1="180" y1="580" x2="420" y2="580" />
      <line x1="180" y1="630" x2="420" y2="630" />
      <line x1="180" y1="680" x2="420" y2="680" />
      <line x1="180" y1="730" x2="420" y2="730" />
      <line x1="180" y1="780" x2="420" y2="780" />
      <line x1="180" y1="830" x2="420" y2="830" />
      <line x1="180" y1="880" x2="420" y2="880" />
      <line x1="180" y1="930" x2="420" y2="930" />
