      <line x1="220" y1="360" x2="440" y2="360" />
      <line x1="220" y1="400" x2="440" y2="400" />
      <line x1="220" y1="440" x2="440" y2="440" />
      <line x1="220" y1="480" x2="440" y2="480" />
      <line x1="220" y1="520" x2="440" y2="520" />
      <line x1="220" y1="560" x2="440" y2="560" />
      <line x1="220" y1="600" x2="440" y2="600" />
      <line x1="220" y1="640" x2="440" y2="640" />
      <line x1="220" y1="680" x2="440" y2="680" />
      <line x1="220" y1="720" x2="440" y2="720" />
      <line x1="220" y1="760" x2="440" y2="760" />
      <line x1="220" y1="800" x2="440" y2="800" />
      <line x1="220" y1="840" x2="440" y2="840" />
      <line x1="220" y1="880" x2="440" y2="880" />
