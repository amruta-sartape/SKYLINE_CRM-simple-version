      <rect x="765" y="455" width="60" height="42" rx="3" />
      <rect x="585" y="525" width="60" height="42" rx="3" />
      <rect x="675" y="595" width="60" height="42" rx="3" />
      <rect x="765" y="665" width="60" height="42" rx="3" />
