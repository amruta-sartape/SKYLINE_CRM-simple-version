<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Twilight Sky Gradient -->
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="35%" stop-color="#0A1426" />
      <stop offset="70%" stop-color="#12233F" />
      <stop offset="100%" stop-color="#1B3156" />
    </linearGradient>

    <!-- Warm Atmospheric City Glow -->
    <radialGradient id="cityWarmth" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#0A1426" stop-opacity="0" />
    </radialGradient>

    <!-- Tower 1: Ultra-Luxury Glass & Steel Tower Facade -->
    <linearGradient id="tower1Facade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16253D" />
      <stop offset="25%" stop-color="#243C60" />
      <stop offset="55%" stop-color="#365B8E" />
      <stop offset="80%" stop-color="#1D3250" />
      <stop offset="100%" stop-color="#0F1D30" />
    </linearGradient>

    <!-- Tower 2: High-Rise Curvature Facade -->
    <linearGradient id="tower2Facade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2D48" />
      <stop offset="40%" stop-color="#2D4D78" />
      <stop offset="75%" stop-color="#416EA8" />
      <stop offset="100%" stop-color="#172840" />
    </linearGradient>

    <!-- Tower 3: Stepped Modern High-Rise -->
    <linearGradient id="tower3Facade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#122035" />
      <stop offset="50%" stop-color="#223B5E" />
      <stop offset="100%" stop-color="#0D1828" />
    </linearGradient>

    <!-- Warm Golden Penthouse Light -->
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Cyan Architectural Glass Glaze -->
    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Crisp Balcony Railing Gradient -->
    <linearGradient id="balconyGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="1920" height="1080" fill="url(#twilightSky)" />
  <rect width="1920" height="1080" fill="url(#cityWarmth)" />

  <!-- ================= BACKGROUND SILHOUETTES & HORIZON TOWERS ================= -->
